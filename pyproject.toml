[project]
name = "genai-explorations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aplpy>=2.2.0",
    "astropy>=6.1.7",
    "bdsf>=1.13.0.post2",
    "beautifulsoup4>=4.13.4",
    "chromadb>=1.0.12",
    "dlt[qdrant]>=1.12.1",
    "ebooklib>=0.19",
    "elasticsearch>=9.0.2",
    "fastembed>=0.7.1",
    "fastmcp>=2.10.5",
    "google-genai>=1.18.0",
    "ipython>=8.37.0",
    "jupyter>=1.1.1",
    "langchain[anthropic]>=0.3.25",
    "langchain-anthropic>=0.3.18",
    "langchain-community>=0.3.24",
    "langchain-core>=0.3.64",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.21",
    "langchain-text-splitters>=0.3.8",
    "langgraph>=0.4.8",
    "langsmith>=0.3.45",
    "markdown>=3.8.2",
    "matplotlib>=3.10.5",
    "minsearch>=0.0.4",
    "mlflow>=3.2.0",
    "nb-clean>=4.0.1",
    "openai>=1.84.0",
    "openrouter-client>=0.1.0",
    "pandas>=2.3.0",
    "photutils>=2.0.2",
    "playwright>=1.53.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.0",
    "qdrant-client[fastembed]>=1.14.3",
    "radio-beam>=0.3.9",
    "regions>=0.10",
    "rouge>=1.0.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "tavily-python>=0.7.10",
    "tiktoken>=0.9.0",
    "tqdm>=4.67.1",
    "langchain-tavily>=0.2.11",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "mlx-lm>=0.22.0",
    "mlx-audio",
]

[project.scripts]
evaluate-transcripts = "tts.evaluate_transcripts:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio.git" }
